<script>
function syncRequiredFields() {
  const form = document.querySelector('form');
  if (!form) return;

  // Toggle `required` only on inputs inside visible installation sections
  form.querySelectorAll('[data-install-section]').forEach((section) => {
    const isVisible = section.offsetParent !== null && !section.hidden;
    section.querySelectorAll('input, select, textarea').forEach((field) => {
      if (field.dataset.optional === 'true' || field.type === 'hidden') {
        field.required = false;
      } else {
        field.required = isVisible;
      }
    });
  });
}

function validateChecklistBeforeAction() {
  syncRequiredFields();
  const form = document.querySelector('form');
  if (!form) return true;

  if (!form.reportValidity()) {
    return false;
  }

  // Optional check if your Yes/No toggles are buttons/hidden inputs rather than required inputs
  const unanswered = Array.from(form.querySelectorAll('[data-required-toggle="true"]'))
    .filter((el) => !el.value || el.value === 'Unanswered');

  if (unanswered.length > 0) {
    unanswered[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    alert('Please answer every Yes/No question for this installation before continuing.');
    return false;
  }

  return true;
}
</script>
